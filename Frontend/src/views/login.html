<!-- Cumple con: Etiquetas asociadas, jerarquía de encabezados, sin inline scripts/styles -->
<main class="auth-container" aria-labelledby="login-title">
  <h1 id="login-title">Iniciar Sesión</h1>
  
  <!-- Región para anuncios accesibles (aria-live) -->
  <div id="alert-region" role="alert" aria-live="polite" class="alert hidden"></div>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required autocomplete="username" aria-describedby="email-error">
      <span id="email-error" class="error-text hidden">Ingresa un correo válido</span>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" aria-describedby="password-error">
      <span id="password-error" class="error-text hidden">La contraseña es obligatoria</span>
    </div>

    <button type="submit" id="submit-btn" class="btn-primary">Ingresar</button>
  </form>

  <nav aria-label="Enlaces de autenticación" class="auth-links">
    <a href="/forgot-password">¿Olvidaste tu contraseña?</a>
    <a href="/register">Crear una cuenta</a>
  </nav>
</main>
